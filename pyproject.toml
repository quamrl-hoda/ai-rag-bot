[project]
name = "ai-rag-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "quamrul hoda", email = "qhoda489@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22.1",
    "ddgs>=9.16.0",
    "fastmcp>=3.4.8",
    "langchain-mcp-adapters>=0.3.2",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-sqlite>=3.1.1",
]

[project.scripts]
ai-rag-bot = "ai_rag_bot:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
